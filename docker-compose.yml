services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d products"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  product-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: product-service
    environment:
      GRPC_ADDR: ":9090"
      DATABASE_URL: postgres://app:app@postgres:5432/products?sslmode=disable
      DB_MAX_CONNS: "10"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    environment:
      HTTP_ADDR: ":8080"
      GRPC_TARGET: product-service:9090
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      product-service:
        condition: service_started

volumes:
  pgdata:
