syntax = "proto3";

package order.v1;

option go_package = "github.com/KantapatSg/golang-essential-gRPC/gen/order;orderv1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  CONFIRMED = 2;
  CANCELLED = 3;
}

message OrderItem {
  string name = 1;
  int32 quantity = 2;
  double unit_price = 3;
}

message Order {
  string id = 1;
  string customer_name = 2;
  string customer_email = 3;
  repeated OrderItem items = 4;
  double total_amount = 5;
  OrderStatus status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message CreateOrderRequest { string customer_name = 1; string customer_email = 2; repeated OrderItem items = 3; OrderStatus status = 4; }
message GetOrderRequest { string id = 1; }
message ListOrdersRequest { int32 page = 1; int32 page_size = 2; }
message ListOrdersResponse { int32 page = 1; int32 page_size = 2; int64 total = 3; repeated Order orders = 4; }
message UpdateOrderRequest { string id = 1; string customer_name = 2; string customer_email = 3; repeated OrderItem items = 4; OrderStatus status = 5; }
message DeleteOrderRequest { string id = 1; }

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc UpdateOrder(UpdateOrderRequest) returns (Order);
  rpc DeleteOrder(DeleteOrderRequest) returns (google.protobuf.Empty);
}
